# Alacritty config — converted from alacritty.yml (YAML support removed in 0.14).
# Shared via dotfiles. NOTE: terminal.shell.program is OS-specific:
#   macOS: /opt/homebrew/bin/tmux    Linux: /usr/bin/tmux
[window]
startup_mode = "Maximized"
decorations = "none"
# Make Option act as Meta (iTerm's "Option as Esc+") so Option+Left/Right/Backspace
# do word navigation/delete at the shell.
option_as_alt = "Both"

[font]
size = 18.0

[font.normal]
family = "0xProto Nerd Font Mono"

[terminal.shell]
program = "/opt/homebrew/bin/tmux"

# Cmd+S at the shell prompt -> run `gst` (git status). Terminal-only, so Save
# still works in GUI apps. \u0015 = Ctrl-U (clear line), \r = Enter.
[[keyboard.bindings]]
mods = "Command"
key = "S"
chars = "\u0015gst\r"

# iTerm parity for shell line editing:
[[keyboard.bindings]]
mods = "Command"
key = "Left"
chars = "\u0001"   # Ctrl-A: start of line

[[keyboard.bindings]]
mods = "Command"
key = "Right"
chars = "\u0005"   # Ctrl-E: end of line

[[keyboard.bindings]]
mods = "Command"
key = "Back"
chars = "\u0015"   # Ctrl-U: clear line

[[keyboard.bindings]]
mods = "Command"
key = "L"
chars = "\u0015l\r"   # clear line + run `l`

[[keyboard.bindings]]
mods = "Command"
key = "J"
chars = "\u001bj"   # send M-j -> tmux previous-window (existing bind -n M-j)

[[keyboard.bindings]]
mods = "Command"
key = "K"
chars = "\u001bk"   # send M-k -> tmux next-window (existing bind -n M-k)

# iTerm parity: Cmd+<letter> neutralized to just type the letter (terminal-only).
[[keyboard.bindings]]
mods = "Command"
key = "B"
chars = "b"

[[keyboard.bindings]]
mods = "Command"
key = "D"
chars = "d"

[[keyboard.bindings]]
mods = "Command"
key = "F"
chars = "f"

[[keyboard.bindings]]
mods = "Command"
key = "N"
chars = "n"

[[keyboard.bindings]]
mods = "Command"
key = "P"
chars = "p"

[[keyboard.bindings]]
mods = "Command"
key = "T"
chars = "t"

[[keyboard.bindings]]
mods = "Command"
key = "U"
chars = "u"

[[keyboard.bindings]]
mods = "Command"
key = "W"
chars = "w"

[[keyboard.bindings]]
mods = "Command"
key = "Period"
chars = "."
